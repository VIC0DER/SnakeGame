 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Snake</title>
    <style>
        /* Estilos CSS */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin-top: 50px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .score-board {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        canvas {
            background-color: #34495e;
            border: 4px solid #ecf0f1;
            box-shadow: 0 0 15px rgba(0,0,0,0.6);
            border-radius: 5px;
        }

        p {
            margin-top: 15px;
            color: #bdc3c7;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <div class="score-board">Puntuación: <span id="score">0</span></div>
    
    <!-- Tablero de juego -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    
    <p>Usa las flechas del teclado (↑, ↓, ←, →) para jugar.</p>

    <script>
        // --- Código JavaScript ---

        // Configuración del canvas
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Variables del juego
        const gridSize = 20;
        let score = 0;
        let changingDirection = false;
        
        // La serpiente es un array de coordenadas
        let snake = [
            {x: 200, y: 200},
            {x: 180, y: 200},
            {x: 160, y: 200}
        ];

        // Velocidad inicial (hacia la derecha)
        let dx = gridSize;
        let dy = 0;

        // Comida
        let food = {x: 0, y: 0};

        // Iniciar el juego
        document.addEventListener("keydown", changeDirection);
        generateFood();
        main();

        // Bucle principal del juego
        function main() {
            if (hasGameEnded()) {
                alert("¡Juego terminado! Tu puntuación final es: " + score);
                document.location.reload(); // Recargar la página para reiniciar
                return;
            }

            changingDirection = false;
            
            // Velocidad del juego (100 ms por fotograma)
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                advanceSnake();
                drawSnake();
                main();
            }, 100);
        }

        // Limpiar el tablero
        function clearCanvas() {
            ctx.fillStyle = "#34495e";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        // Dibujar toda la serpiente
        function drawSnake() {
            snake.forEach(drawSnakePart);
        }

        // Dibujar una parte de la serpiente
        function drawSnakePart(snakePart) {
            ctx.fillStyle = "#2ecc71"; // Color del cuerpo
            ctx.strokeStyle = "#27ae60"; // Borde del cuerpo
            ctx.fillRect(snakePart.x, snakePart.y, gridSize, gridSize);
            ctx.strokeRect(snakePart.x, snakePart.y, gridSize, gridSize);
        }

        // Avanzar la serpiente y comprobar si come
        function advanceSnake() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head); // Añadir nueva cabeza

            const hasEatenFood = snake[0].x === food.x && snake[0].y === food.y;
            
            if (hasEatenFood) {
                score += 10;
                document.getElementById('score').innerText = score;
                generateFood(); // Crear nueva comida
            } else {
                snake.pop(); // Eliminar la cola si no ha comido
            }
        }

        // Generar comida en posición aleatoria
        function generateFood() {
            food.x = Math.round((Math.random() * (canvas.width - gridSize)) / gridSize) * gridSize;
            food.y = Math.round((Math.random() * (canvas.height - gridSize)) / gridSize) * gridSize;
            
            // Asegurarse de que la comida no aparezca sobre la serpiente
            snake.forEach(function hasSnakeEatenFood(part) {
                const hasEaten = part.x === food.x && part.y === food.y;
                if (hasEaten) generateFood();
            });
        }

        // Dibujar la comida
        function drawFood() {
            ctx.fillStyle = "#e74c3c"; // Color de la comida (rojo)
            ctx.strokeStyle = "#c0392b";
            ctx.fillRect(food.x, food.y, gridSize, gridSize);
            ctx.strokeRect(food.x, food.y, gridSize, gridSize);
        }

        // Cambiar la dirección con el teclado
        function changeDirection(event) {
            const LEFT_KEY = 37;
            const RIGHT_KEY = 39;
            const UP_KEY = 38;
            const DOWN_KEY = 40;

            if (changingDirection) return;
            
            const keyPressed = event.keyCode;
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if (keyPressed === LEFT_KEY && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === UP_KEY && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if (keyPressed === RIGHT_KEY && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if (keyPressed === DOWN_KEY && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }

        // Comprobar si el juego ha terminado (chocar contra paredes o contra sí misma)
        function hasGameEnded() {
            // Chocar contra sí misma
            for (let i = 4; i < snake.length; i++) {
                if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
            }
            
            // Chocar contra las paredes
            const hitLeftWall = snake[0].x < 0;
            const hitRightWall = snake[0].x >= canvas.width;
            const hitTopWall = snake[0].y < 0;
            const hitBottomWall = snake[0].y >= canvas.height;

            return hitLeftWall || hitRightWall || hitTopWall || hitBottomWall;
        }
    </script>
</body>
</html>
